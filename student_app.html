<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선생님 호출 시스템</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- 서버 호스팅 시 자동으로 불러옴 -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Jua', sans-serif; background-color: #f7fbff; margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #5c6bc0; font-size: 2.2em; margin: 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 16px rgba(92, 107, 192, 0.15); }
        input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 10px; border: 2px solid #e8eaf6; border-radius: 10px; font-family: 'Jua', sans-serif; font-size: 1.1em; }
        input:focus { outline: none; border-color: #5c6bc0; }
        .office-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .office-btn { flex: 0 0 auto; background: #e8eaf6; color: #5c6bc0; border: none; padding: 10px 20px; border-radius: 20px; font-size: 1.1em; font-family: 'Jua', sans-serif; cursor: pointer; transition: all 0.2s; }
        .office-btn.active { background: #5c6bc0; color: white; box-shadow: 0 4px 8px rgba(92, 107, 192, 0.4); }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px;}
        .teacher-btn { padding: 15px 10px; border-radius: 12px; border: none; font-family: 'Jua', sans-serif; font-size: 1.1em; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.1s; }
        .teacher-btn:active { transform: scale(0.95); }
        .status-업무중 { background: linear-gradient(135deg, #a8e063, #56ab2f); color: white; }
        .status-자리비움 { background: linear-gradient(135deg, #ffd194, #ff8235); color: white; }
        .status-퇴근 { background: #f0f0f0; color: #9e9e9e; cursor: not-allowed; box-shadow: none; }
        .footer { text-align: center; margin-top: 40px; color: #ff6b6b; font-size: 1.5em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header"><h1>✨ 선생님 호출 시스템 ✨</h1></div>
    <div class="card">
        <input type="text" id="studentId" placeholder="학번을 입력하세요 (예: 10101)">
        <input type="text" id="studentName" placeholder="이름을 입력하세요 (예: 홍길동)">
    </div>
    <div class="office-tabs" id="officeTabs"></div>
    <div id="seatingChart" class="grid-layout"></div>
    <div id="callForm" class="card" style="display:none; margin-top: 20px; border: 2px solid #5c6bc0;">
        <h2 id="selectedTeacherName" style="color: #5c6bc0; margin-top: 0;"></h2>
        <textarea id="purpose" style="width: 100%; box-sizing: border-box; height: 80px; padding: 10px; border-radius: 10px; border: 1px solid #ccc; font-family: 'Jua', sans-serif; font-size: 1.1em;" placeholder="어떤 일로 오셨나요? 선생님께 보낼 메세지를 적어주세요."></textarea>
        <button onclick="callTeacher()" style="width: 100%; padding: 15px; margin-top: 10px; background: #5c6bc0; color:white; border:none; border-radius: 10px; font-size: 1.3em; font-family: 'Jua', sans-serif; cursor: pointer;">🚀 호출하기</button>
    </div>
    <div class="footer">💖 사랑합니다. 양곡중학교 💖</div>

    <script>
        // 빈 값을 넣으면 현재 브라우저의 URL 주소(IP)를 자동으로 추적하여 연결합니다. (하드코딩 완전 해결)
        const socket = io(); 
        
        let serverData = { teachers: {}, systemData: { offices: [], layouts: {} } };
        let currentOffice = "";
        let currentTargetId = "";

        socket.on('sync_data', (data) => {
            serverData = data;
            if (!currentOffice && serverData.systemData.offices.length > 0) currentOffice = serverData.systemData.offices[0];
            renderTabs(); renderBoard();
        });

        function renderTabs() {
            const tabs = document.getElementById("officeTabs");
            tabs.innerHTML = "";
            serverData.systemData.offices.forEach(off => {
                const btn = document.createElement("button");
                btn.className = `office-btn ${off === currentOffice ? 'active' : ''}`;
                btn.innerText = off;
                btn.onclick = () => { currentOffice = off; renderTabs(); renderBoard(); };
                tabs.appendChild(btn);
            });
        }

        function renderBoard() {
            const chart = document.getElementById("seatingChart");
            chart.innerHTML = ""; 
            const layout = serverData.systemData.layouts[currentOffice];
            if (!layout || layout.length === 0) {
                chart.innerHTML = "<p style='grid-column: span 2; text-align: center; color: #999;'>선생님 자리가 아직 배치되지 않았어요.</p>";
                return;
            }

            layout.forEach(teacherId => {
                const btn = document.createElement("button");
                if (teacherId && serverData.teachers[teacherId]) {
                    const t = serverData.teachers[teacherId];
                    const statusClass = t.status.split(' ')[0];
                    btn.className = `teacher-btn status-${statusClass}`; 
                    btn.innerHTML = `<div style="font-size:1.2em; margin-bottom:5px;">${t.name} 선생님</div><div style="font-size:0.9em; background:rgba(0,0,0,0.1); border-radius:10px; padding:2px;">${t.status}</div>`;
                    
                    if (statusClass === '업무중') btn.onclick = () => selectTeacher(teacherId, t.name);
                    else btn.onclick = () => alert(`지금은 ${t.name} 선생님을 호출할 수 없어요! (${t.status})`);
                } else {
                    btn.className = "teacher-btn";
                    btn.style.background = "#fff"; btn.style.border = "2px dashed #ddd"; btn.style.color = "#ccc";
                    btn.innerText = "빈 자리"; btn.disabled = true;
                }
                chart.appendChild(btn);
            });
        }

        function selectTeacher(teacherId, teacherName) {
            currentTargetId = teacherId;
            document.getElementById("selectedTeacherName").innerText = `🙋‍♂️ ${teacherName} 선생님 호출`;
            document.getElementById("callForm").style.display = "block";
            document.getElementById("callForm").scrollIntoView({ behavior: 'smooth' });
        }

        function callTeacher() {
            const stuId = document.getElementById("studentId").value;
            const stuName = document.getElementById("studentName").value;
            const purpose = document.getElementById("purpose").value;
            if(!stuId || !stuName || !purpose) return alert("학번, 이름, 방문 목적을 모두 적어주세요!");

            socket.emit("call_teacher", { studentId: stuId, studentName: stuName, targetTeacherId: currentTargetId, purpose: purpose });
            alert("✨ 선생님께 알림이 전송되었습니다! 교무실 앞에서 잠시 기다려주세요.");
            document.getElementById("callForm").style.display = "none";
            document.getElementById("purpose").value = "";
        }
    </script>
</body>
</html>
